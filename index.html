<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Meus Objetivos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: coluna única centralizada; cada objetivo é um bloco com barra de progresso e lista de tarefas */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --fg: #16201c;
  --muted: #5d6b65;
  --line: #dde3e0;
  --accent: #0f7b5f;
  --accent-soft: #d9efe7;
  --track: #e4e9e6;
  --danger: #b3382c;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --surface: #19211e; --fg: #e8efeb; --muted: #93a39b;
    --line: #2a3531; --accent: #3fc79e; --accent-soft: #1d3a31; --track: #28332f; --danger: #ef7a6d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --surface: #19211e; --fg: #e8efeb; --muted: #93a39b;
  --line: #2a3531; --accent: #3fc79e; --accent-soft: #1d3a31; --track: #28332f; --danger: #ef7a6d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--font-display); font-size: 2rem; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.overall { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.overall .bar { flex: 1; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.add-goal { display: flex; gap: 8px; }
.add-goal input, .add-task input {
  flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 8px;
}
.btn {
  background: var(--accent); color: var(--bg); border: 0; border-radius: 8px;
  padding: 10px 16px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
:root[data-theme="dark"] .btn { color: #0b1210; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0b1210; } }
.btn:hover { filter: brightness(1.08); }

.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.goal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.goal-head h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pct { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; color: var(--accent); }
.bar { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: -6px; }
.meta .done-tag { color: var(--accent); font-weight: 600; }

ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
li label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; cursor: pointer; overflow-wrap: anywhere; }
li input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
li.done span { color: var(--muted); text-decoration: line-through; }
.icon-btn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 13px; }
.icon-btn:hover { color: var(--danger); background: var(--accent-soft); }
.add-task { display: flex; gap: 8px; }
.add-task input { padding: 8px 10px; }
.btn.small { padding: 8px 12px; background: var(--accent-soft); color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 28px 0; border: 1px dashed var(--line); border-radius: 12px; }
.no-tasks { color: var(--muted); font-size: 13px; padding: 4px 0; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Meus Objetivos</h1>
    <p class="sub">Crie um objetivo, adicione tarefas e marque cada uma ao concluir.</p>
  </header>

  <div class="overall" id="overall" hidden>
    <span id="overall-text"></span>
    <div class="bar"><i id="overall-bar" style="width:0%"></i></div>
  </div>

  <form class="add-goal" id="goal-form">
    <input id="goal-input" type="text" placeholder="Novo objetivo (ex.: Publicar meu app)" aria-label="Novo objetivo" maxlength="120" required>
    <button class="btn" type="submit">Adicionar objetivo</button>
  </form>

  <main id="goals" style="display:flex;flex-direction:column;gap:16px"></main>
</div>

<script>
(function () {
  var KEY = "objetivos-v1";
  var state;

  function uid() { return Math.random().toString(36).slice(2, 10); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var p = JSON.parse(raw); if (Array.isArray(p)) return p; }
    } catch (e) {}
    return [
      { id: uid(), title: "Exemplo: Lançar meu primeiro app", tasks: [
        { id: uid(), text: "Definir a ideia principal", done: true },
        { id: uid(), text: "Desenhar as telas", done: true },
        { id: uid(), text: "Programar o login", done: false },
        { id: uid(), text: "Publicar na loja", done: false }
      ]},
      { id: uid(), title: "Exemplo: Estudar 30 minutos por dia", tasks: [
        { id: uid(), text: "Escolher o curso", done: true },
        { id: uid(), text: "Montar o horário semanal", done: false }
      ]}
    ];
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function pctOf(g) {
    if (!g.tasks.length) return 0;
    return Math.round(g.tasks.filter(function (t) { return t.done; }).length / g.tasks.length * 100);
  }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }

  function render() {
    var root = document.getElementById("goals");
    root.textContent = "";
    if (!state.length) {
      root.appendChild(el("div", { class: "empty", text: "Nenhum objetivo ainda. Adicione o primeiro acima." }));
    }
    state.forEach(function (g) {
      var p = pctOf(g);
      var doneCount = g.tasks.filter(function (t) { return t.done; }).length;

      var head = el("div", { class: "goal-head" }, [
        el("h2", { text: g.title }),
        el("span", { class: "pct", text: p + "%" })
      ]);
      var bar = el("div", { class: "bar", role: "progressbar", "aria-valuenow": String(p), "aria-valuemin": "0", "aria-valuemax": "100", "aria-label": "Progresso de " + g.title }, [
        el("i", { style: "width:" + p + "%" })
      ]);
      var meta = el("div", { class: "meta" }, [
        el("span", { text: doneCount + " de " + g.tasks.length + " tarefas concluídas" }),
        (g.tasks.length && p === 100) ? el("span", { class: "done-tag", text: "Objetivo concluído" }) : el("span")
      ]);

      var list = el("ul");
      if (!g.tasks.length) list.appendChild(el("div", { class: "no-tasks", text: "Sem tarefas ainda. Adicione abaixo." }));
      g.tasks.forEach(function (t) {
        var cb = el("input", { type: "checkbox", id: "t-" + t.id });
        cb.checked = t.done;
        cb.addEventListener("change", function () { t.done = cb.checked; save(); render(); });
        var li = el("li", { class: t.done ? "done" : "" }, [
          el("label", {}, [cb, el("span", { text: t.text })]),
          (function () {
            var b = el("button", { class: "icon-btn", type: "button", "aria-label": "Excluir tarefa", text: "Excluir" });
            b.addEventListener("click", function () { g.tasks = g.tasks.filter(function (x) { return x.id !== t.id; }); save(); render(); });
            return b;
          })()
        ]);
        list.appendChild(li);
      });

      var input = el("input", { type: "text", id: "ti-" + g.id, placeholder: "Nova tarefa", "aria-label": "Nova tarefa para " + g.title, maxlength: "120", required: "" });
      var form = el("form", { class: "add-task" }, [input, el("button", { class: "btn small", type: "submit", text: "Adicionar" })]);
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var v = input.value.trim();
        if (!v) return;
        g.tasks.push({ id: uid(), text: v, done: false });
        save(); render();
        var again = document.getElementById("ti-" + g.id);
        if (again) again.focus();
      });

      var del = el("button", { class: "icon-btn", type: "button", text: "Excluir objetivo", style: "align-self:flex-start;margin-left:-8px" });
      del.addEventListener("click", function () {
        if (del.dataset.armed) { state = state.filter(function (x) { return x.id !== g.id; }); save(); render(); }
        else { del.dataset.armed = "1"; del.textContent = "Clique de novo para confirmar"; del.style.color = "var(--danger)"; }
      });

      root.appendChild(el("section", { class: "goal" }, [head, bar, meta, list, form, del]));
    });

    var total = 0, done = 0;
    state.forEach(function (g) { total += g.tasks.length; done += g.tasks.filter(function (t) { return t.done; }).length; });
    var ov = document.getElementById("overall");
    ov.hidden = !total;
    var allP = total ? Math.round(done / total * 100) : 0;
    document.getElementById("overall-text").textContent = "Geral: " + allP + "% (" + done + "/" + total + ")";
    document.getElementById("overall-bar").style.width = allP + "%";
  }

  document.getElementById("goal-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var inp = document.getElementById("goal-input");
    var v = inp.value.trim();
    if (!v) return;
    state.unshift({ id: uid(), title: v, tasks: [] });
    inp.value = "";
    save(); render();
  });

  state = load();
  render();
})();
</script>

</body></html>
